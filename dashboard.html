<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roe visibility dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="stripe"></div>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span class="word">roe</span>
        <span class="ed" id="edition"></span>
      </div>
      <p class="tag">Secure what your agents see and do</p>
      <nav id="nav" aria-label="Dashboard sections"></nav>
      <div class="side-foot" id="sidefoot"></div>
    </aside>
    <main>
      <header class="top">
        <div>
          <p class="kicker" id="kicker"></p>
          <h1 id="title"></h1>
          <p class="lede" id="lede"></p>
        </div>
        <div class="top-actions" id="topActions"></div>
      </header>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>
  <dialog id="confirm">
    <form method="dialog">
      <h2 id="confirmTitle"></h2>
      <p id="confirmBody"></p>
      <div class="row end">
        <button value="cancel" class="btn">Cancel</button>
        <button value="ok" class="btn danger" id="confirmOk">Clear</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="edition.js"></script>
  <script src="detector.js"></script>
  <script src="exposure.js"></script>
  <script src="ai-sites.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
